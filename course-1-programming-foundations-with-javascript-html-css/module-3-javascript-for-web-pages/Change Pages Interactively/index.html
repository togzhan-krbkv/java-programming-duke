<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change CSS Classes</title>
    <link rel="stylesheet" type="text/css" href="style.css" media="screen" />
</head>
<body>

    <h1>Change CSS Classes</h1>
    <div id="d1">
        Hello
    </div>
    <div id="d2">
        Goodbye
    </div>
    <div id="button1">
        <input type="button" value="color change" onclick="changeColor()" />
    </div>
    <div id="button2">
        <input type="button" value="text change" onclick="changeText()" />
    </div>

    <script src="script.js"></script>
</body>
</html>
