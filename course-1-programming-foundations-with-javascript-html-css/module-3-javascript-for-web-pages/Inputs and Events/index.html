<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inputs and Events</title>
    <link rel="stylesheet" type="text/css" href="style.css" media="screen" />
</head>
<body>

    <h1>Inputs &amp; Events</h1>
    <canvas id="d1" class="blueback"></canvas>
    <div>
        <input type="button" value="Change Back To Blue" onclick="changeBackToBlue()" />
        <input type="color" value="#FF0000" id="clr" onchange="doColor()" />
        <input type="range" min="10" max="100" value="10" id="sldr" oninput="doSqr()" />
    </div>

    <script src="script.js"></script>
</body>
</html>
